<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merci ! | EURL Le Roho</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thankyou-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-gray-900) 0%, var(--color-gray-800) 100%);
      color: var(--color-white);
      text-align: center;
      padding: var(--space-8);
    }

    .thankyou-content {
      max-width: 600px;
    }

    .thankyou-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-8);
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .thankyou-content h1 {
      font-size: var(--text-4xl);
      margin-bottom: var(--space-4);
      color: var(--color-white);
    }

    .thankyou-content p {
      font-size: var(--text-lg);
      color: var(--color-gray-400);
      margin-bottom: var(--space-8);
      line-height: 1.7;
    }

    .thankyou-redirect {
      font-size: var(--text-sm);
      color: var(--color-gray-600);
      margin-top: var(--space-6);
    }
  </style>
</head>

<body>
  <div class="thankyou-page">
    <div class="thankyou-content">
      <div class="thankyou-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
          stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>

      <h1>Merci pour votre demande !</h1>
      <p>
        Votre demande de devis a bien été envoyée. Nous vous recontacterons dans les plus brefs délais
        pour discuter de votre projet.
      </p>

      <a href="index.html" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        Retour à l'accueil
      </a>

      <p class="thankyou-redirect">Redirection automatique dans <span id="countdown">5</span> secondes...</p>
    </div>
  </div>

  <script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');

    const interval = setInterval(() => {
      seconds--;
      countdownEl.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>
</body>

</html>
